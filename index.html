<!doctype html><html lang="he" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101a16"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon.png"><title>Morning Edge</title><style>
*{box-sizing:border-box}body{margin:0;background:#101a16;color:#f4efe4;font:17px system-ui,sans-serif}main{max-width:1000px;margin:auto;padding:24px 20px 100px}header{display:flex;justify-content:space-between;align-items:center}h1{font-size:clamp(32px,6vw,54px);margin:12px 0}h2{font-size:23px}small,.muted{color:#a8b9ae} .gold{color:#d9bd82}section{background:#1b2922;border:1px solid #35473c;border-radius:20px;padding:20px;margin:16px 0}button,input,textarea{font:inherit;color:inherit;border:1px solid #42574a;border-radius:12px;background:#24372c;padding:12px;min-height:48px}button{cursor:pointer;touch-action:manipulation}button.on{background:#d9bd82;color:#172019}input,textarea{width:100%;background:#101a16;margin:6px 0 12px}textarea{min-height:85px} .row{display:flex;align-items:center;gap:12px;justify-content:space-between}.task{padding:13px 0;border-bottom:1px solid #35473c}.task:last-child{border:0}.task .label{flex:1;text-align:right;background:none;border:0}.done{color:#b8d4ad;text-decoration:line-through}.bar{height:10px;background:#35473c;border-radius:10px;overflow:hidden;margin:12px 0}.bar i{display:block;height:100%;background:#b8d4ad}nav{position:sticky;bottom:0;background:#101a16ed;padding:10px 0;display:flex;gap:6px;flex-wrap:wrap}nav button{flex:1;font-size:14px} .grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.grid button{padding:6px;min-width:0;font-size:13px}.grid small{display:block}.edit{display:grid;grid-template-columns:1fr 70px 70px 48px;gap:5px}.edit input{min-width:0}.clock{font-size:48px;text-align:center;font-variant-numeric:tabular-nums} @media(min-width:750px){.columns{display:grid;grid-template-columns:1fr 1fr;gap:16px}}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid #d9bd82}
</style><main><header><span class="gold" dir="ltr">MORNING EDGE / LAS VEGAS</span><span>☀</span></header><h1 dir="ltr">Own your morning.</h1><div id="app"></div><nav id="nav"></nav></main><script>
const $=s=>document.querySelector(s), key='morning-edge-2', base=[['מים וסידור החדר',5,3],['הליכה באור יום',15,10],['מתיחות ומוביליטי',10,5],['תפילת בוקר',10,5],['מדיטציה',5,2],['קפה וכתיבה ביומן',5,2],['תכנון היום ושלוש מטרות',7,2],['מעקב הרגלים',3,1],['שעה ללא טלפון',0,0]].map((x,i)=>({id:'t'+i,name:x[0],full:x[1],short:x[2]}));let s={tasks:base,days:{},reminder:'10:00'},warning='';try{s=JSON.parse(localStorage.getItem(key))||s}catch(e){warning='אחסון לא זמין או פגום'}function save(){try{localStorage.setItem(key,JSON.stringify(s))}catch(e){warning='השמירה נכשלה — יש לייצא גיבוי';}}const dk=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`,today=()=>dk(new Date());let date=today(),tab='routine',month=new Date(),timer=null;const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function day(k=date){return s.days[k]??={mode:'full',tasks:structuredClone(s.tasks),done:[],journal:['','','',''],goals:['','',''],goalDone:[],plan:''}}function pct(d){return d?.tasks.length?Math.round(100*d.tasks.filter(t=>d.done.includes(t.id)).length/d.tasks.length):0}function streak(){let d=new Date(),n=0;if(pct(s.days[dk(d)])!==100)d.setDate(d.getDate()-1);while(pct(s.days[dk(d)])===100){n++;d.setDate(d.getDate()-1)}return n}const qs=['איך אני מרגיש פיזית ומנטלית?','על מה אני אסיר תודה?','איזה אדם אני רוצה להיות היום?','מה האתגר שלי ואיך אתמודד איתו?'];function clock(){let n=timer?Math.max(0,Math.ceil(timer.end? (timer.end-Date.now())/1000:timer.left)):0;return `${String(Math.floor(n/60)).padStart(2,'0')}:${String(n%60).padStart(2,'0')}`}function render(){let d=day(),p=pct(d),h=`<div class="row muted"><span>${esc(date)}</span><button data-a="today">היום</button></div>`;if(tab==='routine'){let total=d.tasks.reduce((a,t)=>a+t[d.mode],0);h+=`<section><small>DAILY PROGRESS</small><h1 class="gold">${p}%</h1><div class="bar"><i style="width:${p}%"></i></div>${d.done.length} / ${d.tasks.length} הרגלים · ${streak()} ימי רצף</section><div class="row"><button data-mode="full" class="${d.mode==='full'?'on':''}">רוטינה מלאה</button><button data-mode="short" class="${d.mode==='short'?'on':''}">מקוצרת</button><span>${total} דקות</span></div>`;if(timer)h+=`<section><div>${esc(timer.name)}</div><div class="clock" id="clock">${clock()}</div><div class="row"><button data-a="pause">${timer.end?'השהה':'המשך'}</button><button data-a="finish">בוצע</button><button data-a="cancel">סגור</button></div></section>`;h+='<section>'+d.tasks.map(t=>`<div class="row task"><button data-check="${t.id}" class="${d.done.includes(t.id)?'on':''}">${d.done.includes(t.id)?'✓':'○'}</button><button class="label ${d.done.includes(t.id)?'done':''}" data-check="${t.id}">${esc(t.name)}<br><small>${t[d.mode]||'הרגל לאורך השעה'} ${t[d.mode]?'דק׳':''}</small></button>${t[d.mode]?`<button data-timer="${t.id}">▷</button>`:''}</div>`).join('')+'</section>';if(p===100)h+='<section class="gold">✦ ניצחת את הבוקר!</section>'}if(tab==='journal')h+=`<div class="columns"><section><h2>Morning Journal</h2>${qs.map((q,i)=>`<label>${q}<textarea data-j="${i}">${esc(d.journal[i])}</textarea></label>`).join('')}</section><section><h2>Daily Goals</h2>${['מקצועית','בריאותית','אישית'].map((q,i)=>`<label>${q}</label><div class="row"><input data-g="${i}" value="${esc(d.goals[i])}"><button data-gc="${i}" class="${d.goalDone.includes(i)?'on':''}">✓</button></div>`).join('')}<label>תכנון היום<textarea data-plan>${esc(d.plan)}</textarea></label></section></div>`;if(tab==='history'){let y=month.getFullYear(),m=month.getMonth();h+=`<section><div class="row"><button data-a="prev">‹</button><h2>${month.toLocaleDateString('he-IL',{month:'long',year:'numeric'})}</h2><button data-a="next">›</button></div><div class="grid">${['א','ב','ג','ד','ה','ו','ש'].map(x=>`<small>${x}</small>`).join('')}${'<span></span>'.repeat(new Date(y,m,1).getDay())}${Array.from({length:new Date(y,m+1,0).getDate()},(_,i)=>{let k=dk(new Date(y,m,i+1));return `<button data-date="${k}" class="${k===date?'on':''}">${i+1}<small>${s.days[k]?pct(s.days[k])+'%':'–'}</small></button>`}).join('')}</div></section><section>${date} · ${p}% <button data-tab="routine">רוטינה</button> <button data-tab="journal">יומן</button></section>`}if(tab==='stats'){let ds=Object.values(s.days).filter(d=>d.done.length||d.journal.some(Boolean)||d.goals.some(Boolean)),n=ds.length;h+=`<section><h2>Performance</h2><h1 class="gold">${n?Math.round(ds.reduce((a,d)=>a+pct(d),0)/n):0}%</h1>ממוצע בימים מתועדים · ${streak()} ימי רצף · ${ds.filter(d=>pct(d)===100).length} ימים מלאים</section><section>${s.tasks.map(t=>{let a=ds.filter(d=>d.tasks.some(x=>x.id===t.id)),v=a.length?Math.round(a.filter(d=>d.done.includes(t.id)).length/a.length*100):0;return `${esc(t.name)} · ${v}%<div class="bar"><i style="width:${v}%"></i></div>`}).join('')}</section>`}if(tab==='settings')h+=`<section><h2>Routine Settings</h2><small>שם · דקות מלאה · דקות קצרה · מחיקה. השינויים יחולו מהיום ואילך.</small>${s.tasks.map(t=>`<div class="edit"><input data-edit="${t.id}" data-field="name" value="${esc(t.name)}"><input type="number" min="0" max="180" data-edit="${t.id}" data-field="full" value="${t.full}"><input type="number" min="0" max="180" data-edit="${t.id}" data-field="short" value="${t.short}"><button data-del="${t.id}">×</button></div><button data-up="${t.id}">↑ הזז למעלה</button>`).join('')}<p><button data-a="add">+ הרגל</button> <button data-a="apply">החל על היום</button></p></section><section><h2>Reminder</h2><input type="time" id="rem" value="${s.reminder}"><button data-a="ics">צור תזכורת יומית ליומן</button><p class="muted">יש לפתוח את הקובץ ביומן ולאשר התראה חוזרת. אין התראות עצמאיות כשהאתר סגור.</p></section><section><h2>Backup</h2><button data-a="export">ייצוא גיבוי</button><label>שחזור גיבוי<input type="file" id="import" accept=".json,application/json"></label></section>`;$('#app').innerHTML=h+`<small>${esc(warning)}</small>`;$('#nav').innerHTML=[['routine','הבוקר'],['journal','יומן'],['history','היסטוריה'],['stats','התקדמות'],['settings','הגדרות']].map(([k,l])=>`<button data-tab="${k}" class="${tab===k?'on':''}">${l}</button>`).join('')}
function download(name,body,type){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([body],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}document.addEventListener('input',e=>{let a=e.target.dataset,d=day(),v=e.target.value;if(a.j!==undefined)d.journal[+a.j]=v;if(a.g!==undefined)d.goals[+a.g]=v;if(a.plan!==undefined)d.plan=v;if(a.edit){let t=s.tasks.find(t=>t.id===a.edit);t[a.field]=a.field==='name'?v:Math.max(0,Math.min(180,+v||0))}if(e.target.id==='rem')s.reminder=v;save()});document.addEventListener('change',async e=>{if(e.target.id==='import'){try{let v=JSON.parse(await e.target.files[0].text());if(!Array.isArray(v.tasks)||!v.days||!v.tasks.every(t=>typeof t.name==='string'&&typeof t.id==='string'&&Number.isFinite(t.full)&&Number.isFinite(t.short))||!Object.values(v.days).every(d=>Array.isArray(d.tasks)&&Array.isArray(d.done)&&Array.isArray(d.journal)&&Array.isArray(d.goals)&&Array.isArray(d.goalDone)))throw Error();if(confirm('להחליף את הנתונים הקיימים?')){s=v;save();render()}}catch{alert('גיבוי לא תקין')}}});document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;let a=b.dataset,d=day();if(a.tab)tab=a.tab;if(a.mode)d.mode=a.mode;if(a.date)date=a.date;if(a.check)d.done=d.done.includes(a.check)?d.done.filter(x=>x!==a.check):[...d.done,a.check];if(a.gc!==undefined){let i=+a.gc;d.goalDone=d.goalDone.includes(i)?d.goalDone.filter(x=>x!==i):[...d.goalDone,i]}if(a.timer){let t=d.tasks.find(t=>t.id===a.timer);timer={id:t.id,name:t.name,date,end:Date.now()+t[d.mode]*60000,left:t[d.mode]*60}}if(a.del&&confirm('למחוק הרגל מהתבנית?'))s.tasks=s.tasks.filter(t=>t.id!==a.del);if(a.up){let i=s.tasks.findIndex(t=>t.id===a.up);if(i>0)[s.tasks[i-1],s.tasks[i]]=[s.tasks[i],s.tasks[i-1]]}switch(a.a){case'today':date=today();break;case'prev':month=new Date(month.getFullYear(),month.getMonth()-1,1);break;case'next':month=new Date(month.getFullYear(),month.getMonth()+1,1);break;case'pause':if(timer.end){timer.left=Math.max(0,Math.ceil((timer.end-Date.now())/1000));timer.end=0}else timer.end=Date.now()+timer.left*1000;break;case'finish':{let x=day(timer.date);if(!x.done.includes(timer.id))x.done.push(timer.id);timer=null;break}case'cancel':timer=null;break;case'add':s.tasks.push({id:'x'+Date.now(),name:'הרגל חדש',full:5,short:2});break;case'apply':{let x=day(today());x.tasks=structuredClone(s.tasks);x.done=x.done.filter(id=>x.tasks.some(t=>t.id===id));break}case'export':download('morning-edge-backup.json',JSON.stringify(s),'application/json');return;case'ics':{let time=(s.reminder||'10:00').replace(':','')+'00',start=today().replaceAll('-','')+'T'+time;download('morning-edge.ics',['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Morning Edge//HE','BEGIN:VEVENT','UID:morning-edge-'+Date.now()+'@local','DTSTAMP:'+new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d+Z/,'Z'),'DTSTART:'+start,'DURATION:PT5M','RRULE:FREQ=DAILY','SUMMARY:Morning Edge','BEGIN:VALARM','TRIGGER:PT0M','ACTION:DISPLAY','DESCRIPTION:Morning Edge','END:VALARM','END:VEVENT','END:VCALENDAR'].join('\r\n'),'text/calendar');return}}save();render()});setInterval(()=>{if($('#clock'))$('#clock').textContent=clock();if(timer?.end&&Date.now()>=timer.end){timer.end=0;timer.left=0;render()}},500);render();if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></html>
